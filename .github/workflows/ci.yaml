name: WebAppGo CI Pipeline

on:
  push:
    branches:
    - main
    paths-ignore:
    - 'helm/webappgo/values.yaml'
    - 'k8s/**'
    - 'README.md'

  pull_request:
    branches:
    - main

permissions:
  contents: write

jobs:

  # STAGE 1: BUILD AND TEST
  build-and-test:
    name: Build and Test Go Application
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Build application
      run: go build ./...

    - name: Run tests
      run: go test -v ./...

  # STAGE 2: CODE QUALITY
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Check Go formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "Go formatting issues found:"
          gofmt -l .
          exit 1
        fi

    - name: Run Go vet
      run: go vet ./...

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest

  # STAGE 3: DOCKER BUILD AND PUSH
  docker-build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: code-quality

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Generate Docker image tag
      run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/webappgo:${{ env.IMAGE_TAG }}

  # STAGE 4: UPDATE HELM IMAGE TAG
  update-helm-image-tag:
    name: Update Helm Chart Image Tag
    runs-on: ubuntu-latest
    needs: docker-build-and-push

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Generate Docker image tag
      run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

    - name: Update Helm values.yaml
      run: |
        sed -i -E "s/^  tag: .*/  tag: \"${IMAGE_TAG}\"/" helm/webappgo/values.yaml

    - name: Commit and push Helm changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add helm/webappgo/values.yaml

        if git diff --cached --quiet; then
          echo "No Helm changes to commit."
        else
          git commit -m "Update Helm image tag to ${IMAGE_TAG}"
          git push
        fi
